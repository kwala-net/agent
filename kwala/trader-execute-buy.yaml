Name: trader-execute-buy

# Fires when the server calls openTrade() on the TraderAgent contract.
# Executes a buy swap on Uniswap V3 using the Kwala smart wallet.
# tokenIn = WETH (ETH sent as msg.value), tokenOut = target token, fee = 3000 (0.3%)

Trigger:
  TriggerSourceContract: "REPLACE_WITH_TRADERAGENT_CONTRACT_ADDRESS"
  TriggerChainID: 11155111
  TriggerEventName: "BuySignal(uint256,address,uint256,uint256)"

# re.event(0) = tradeId
# re.event(1) = token address
# re.event(2) = amountWei (ETH in)
# re.event(3) = entryPrice (USD × 1e8, for reference)

Actions:
  - Name: ExecuteBuy
    Type: call
    TargetContract: "0x3bFA4769FB09eefC5a80d6E87c3B9C650f7Ae48e"
    TargetFunction: "exactInputSingle((address,address,uint24,address,uint256,uint256,uint160))"
    TargetParams:
      - ["0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14", "re.event(1)", "3000", "REPLACE_WITH_KWALA_SMART_WALLET", "re.event(2)", "0", "0"]
    ChainID: 11155111
    SmartWallet: "REPLACE_WITH_KWALA_SMART_WALLET"
    RetriesUntilSuccess: 2

  - Name: NotifyServerBuyFired
    Type: post
    APIEndpoint: "https://REPLACE_WITH_YOUR_SERVER_URL/api/trade-fired"
    APIPayload:
      tradeId: "re.event(0)"
      token: "re.event(1)"
      amount: "re.event(2)"
      direction: "BUY"
      status: "submitted"
    RetriesUntilSuccess: 3

Execution:
  Mode: sequential
