Name: trader-observe-btc

# Cron: runs every hour, POSTs to /api/observe.
# The server fetches the BTC/USD price directly from Chainlink on Sepolia —
# no price is passed in the payload.
#
# /api/observe fetches price → calls LLM → records round on-chain →
# emits BuySignal or SellSignal if warranted.

Trigger:
  RepeatEvery: interval
  IntervalSeconds: 3600

Actions:
  - Name: NotifyAgentServer
    Type: post
    APIEndpoint: "https://REPLACE_WITH_YOUR_SERVER_URL/api/observe"
    APIPayload:
      signal: "cron_tick"
      token: "BTC"
    RetriesUntilSuccess: 3
