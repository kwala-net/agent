Name: trader-observe-btc

# Event-driven: fires whenever TraderAgent emits PriceUpdated.
# Passes the new BTC price to /api/observe, which runs the LLM decision loop.
#
# PriceUpdated(uint256 indexed oldPrice, uint256 indexed newPrice)
#   re.result(0) = oldPrice (USD×1e8)
#   re.result(1) = newPrice (USD×1e8)

Trigger:
  EventSignature: "PriceUpdated(uint256,uint256)"
  ContractAddress: "REPLACE_WITH_TRADERAGENT_CONTRACT_ADDRESS"
  ChainID: 11155111

Actions:
  - Name: NotifyAgentServer
    Type: post
    APIEndpoint: "https://REPLACE_WITH_YOUR_SERVER_URL/api/observe"
    APIPayload:
      signal: "re.result(0)"
      token: "BTC"
      price: "re.result(1)"
    RetriesUntilSuccess: 3
